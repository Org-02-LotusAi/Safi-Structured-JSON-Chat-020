# NATS server config. JetStream on, small payload limit, internal network only.
port: 4222
max_payload: 262144   # 256 KB

jetstream {
  store_dir: /data
}

# Optional authentication. To enable:
#   1. Uncomment the authorization block below.
#   2. Set NATS_USER and NATS_PASS in .env (the same values the worker and server use).
# NATS expands $NATS_USER / $NATS_PASS from the nats-server process environment.
# Note: the nats container does not read .env by default, so these variables must
# also be passed to the nats service in docker-compose.yml (not wired yet).
# authorization {
#   user: $NATS_USER
#   password: $NATS_PASS
# }

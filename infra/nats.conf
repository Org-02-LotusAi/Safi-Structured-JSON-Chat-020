# NATS server config. JetStream on, small payload limit, internal network only.
port: 4222
max_payload: 262144   # 256 KB

jetstream {
  store_dir: /data
}

# Optional authentication. Uncomment and set NATS_USER / NATS_PASS in the nats
# service environment (env_file ../.env); NATS expands $VAR references at startup.
# Then set the same NATS_USER / NATS_PASS for the worker and server.
# authorization {
#   user: $NATS_USER
#   password: $NATS_PASS
# }

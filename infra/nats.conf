# NATS server config. JetStream on, small payload limit, internal network only.
port: 4222
max_payload: 262144   # 256 KB

jetstream {
  store_dir: /data
}

# Authentication: not set here. Put NATS_USER / NATS_PASS in .env; docker-compose.yml passes
# them to this container and starts nats-server with --user/--pass when NATS_USER is non-empty
# (the worker and server use the same values). Leave them empty to run unauthenticated on the
# internal compose network (no host port is published).

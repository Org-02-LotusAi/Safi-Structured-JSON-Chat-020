# Run from the repo root (the --env-file flag is needed so ${...} below, e.g. NATS_USER, is read
# from the repo-root .env rather than infra/.env). npm wrappers: npm run stack:up / stack:up:dev / stack:down.
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# NATS publishes no host port here; worker and server reach it on the internal network. To let
# `npm run verify:live` / `npm run drill:recovery` reach NATS, add the dev override
# (127.0.0.1:4222 only):  -f infra/docker-compose.dev.yml
name: safi-chat-020
services:
  nats:
    image: nats:2.11.17-alpine
    # Only NATS_USER / NATS_PASS reach this container (not the rest of .env). If NATS_USER is set,
    # authentication is enabled; the worker and server pick the same values up from .env.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$NATS_USER" ]; then
          exec nats-server -js -c /etc/nats/nats.conf --user "$$NATS_USER" --pass "$$NATS_PASS"
        fi
        exec nats-server -js -c /etc/nats/nats.conf
    environment:
      NATS_USER: ${NATS_USER:-}
      NATS_PASS: ${NATS_PASS:-}
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    networks: [internal]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "worker/dist/main.js"]
    env_file: ../.env
    # env_file loads all of .env; blank what the worker never needs (login + session secrets).
    # Reaching a fake/local OpenAI from here: OPENAI_BASE_URL=http://host.docker.internal:<port>/v1
    environment:
      NATS_URL: nats://nats:4222
      PILOT_USERNAME: ""
      PILOT_PASSWORD: ""
      SESSION_SECRET: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [nats]
    networks: [internal]
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "server/dist/main.js"]
    env_file: ../.env
    # env_file loads all of .env, so the server would otherwise see OPENAI_API_KEY.
    # Only the worker calls OpenAI; blank the key here so it never reaches this container.
    # TLS paths point at the container mount (./certs on the host -> /app/certs).
    environment:
      NATS_URL: nats://nats:4222
      DATA_DIR: /app/data
      TLS_CERT_FILE: /app/certs/dev.crt
      TLS_KEY_FILE: /app/certs/dev.key
      OPENAI_API_KEY: ""
    # Loopback only by default: the login throttle trusts X-Forwarded-For only for TRUST_PROXY_HOPS hops,
    # so the port must not be directly reachable by untrusted clients. For public exposure use the
    # caddy profile below (Caddy reaches this service on the internal network; set TRUST_PROXY_HOPS=1)
    # or `npm run share:tunnel` (targets localhost:8443; set TRUST_PROXY_HOPS=1).
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs:/app/certs:ro
      - server-data:/app/data
    depends_on: [nats]
    networks: [internal]
    restart: unless-stopped

  # Optional public TLS front door:  docker compose --profile public up -d
  # Needs SAFI_DOMAIN in .env and DNS pointing at this host; Caddy obtains a real certificate.
  caddy:
    image: caddy:2-alpine
    profiles: [public]
    environment:
      SAFI_DOMAIN: ${SAFI_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [server]
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  nats-data:
  server-data:
  caddy-data:
